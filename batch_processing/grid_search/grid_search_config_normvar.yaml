lr:
  - 0.008
epochs:
  - 1000
reference_leiden_clustering_resolution:
  - 3.0
# Normalization comparison at the near-one-hot loss config (sGini=1, mGini=1).
# Both runs normalize_total; they differ only in whether log1p is applied.
# The raw (normalize_and_log=false) baseline is run 2 of onehot_grid_pair0.
#   run 0 -> normalize-only   (log_transform=false)
#   run 1 -> normalize + log1p (log_transform=true)
normalize_and_log:
  - true
log_transform:
  - false
  - true
loss_weights:
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 1.0
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 1.0
    lambda_merge_coherence: 0.25
