lr:
  - 0.008
epochs:
  - 1000
reference_leiden_clustering_resolution:
  - 3.0
# One-hot / prob≈det experiment. Goal: make G (subcluster->state) and P
# (spot->state) as one-hot as possible so the deterministic (argmax) and
# probabilistic reconstructions coincide. Two crossed axes:
#   * normalize_and_log {false, true}  (known lever for the raw-count gap)
#   * G-sharpener (Shannon merge_entropy vs Gini merge_gini) x
#     P-sharpener (Shannon spot_entropy vs Gini spot_gini), varying strength.
# Shared base: rec=0.5/0.5, state_entropy=0.5, merge_coherence=0.25.
# 6 sharpening configs x 2 norm = 12 runs.
normalize_and_log:
  - false
loss_weights:
  # 0) shannon_both — legacy-style: Shannon on both G and P
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.5
    lambda_spot_gini: 0.0
    lambda_merge_entropy: 1.0
    lambda_merge_gini: 0.0
    lambda_merge_coherence: 0.25
  # 1) gini_both_lo — proposed default: Gini on both, moderate P
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 0.5
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 1.0
    lambda_merge_coherence: 0.25
  # 2) gini_both_hi — Gini on both, strong P
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 1.0
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 1.0
    lambda_merge_coherence: 0.25
  # 3) giniG_shannonP — isolate the new G-Gini (Shannon P)
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.5
    lambda_spot_gini: 0.0
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 1.0
    lambda_merge_coherence: 0.25
  # 4) shannonG_giniP — isolate the P-Gini (Shannon G)
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 0.5
    lambda_merge_entropy: 1.0
    lambda_merge_gini: 0.0
    lambda_merge_coherence: 0.25
  # 5) gini_light — Gini on both, light (preserve absolute cossim)
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 0.5
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 0.5
    lambda_merge_coherence: 0.25
