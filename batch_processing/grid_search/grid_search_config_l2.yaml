lr:
  - 0.008
epochs:
  - 1000
reference_leiden_clustering_resolution:
  - 3.0
# L2-normalized state-profile test, all in LINEAR space (normalize_and_log=false).
# Cross l2_normalize_profiles {false,true} with a soft (sGini=0.5) and sharp
# (sGini=1) P sharpener. If L2 works, the prob->det gap should collapse even for
# the soft config, because the residual probability mass can no longer be
# amplified by heterogeneous ||M_k||.
#   run 0: l2=false, sGini=0.5   run 1: l2=false, sGini=1
#   run 2: l2=true,  sGini=0.5   run 3: l2=true,  sGini=1
normalize_and_log:
  - false
l2_normalize_profiles:
  - false
  - true
loss_weights:
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 0.5
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 1.0
    lambda_merge_coherence: 0.25
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.0
    lambda_spot_gini: 1.0
    lambda_merge_entropy: 0.0
    lambda_merge_gini: 1.0
    lambda_merge_coherence: 0.25
