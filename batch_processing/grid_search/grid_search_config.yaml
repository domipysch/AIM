lr:
  - 0.008
epochs:
  - 1000
normalize_and_log:
  - false
  - true
reference_leiden_clustering_resolution:
  - 3.0
# Spot->state sharpening experiment. Shared base: rec=0.5/0.5,
# state_entropy=0.5, merge_entropy=0.0, merge_coherence=0.25. Only the
# spot-sharpening block varies. Each dict is one alternative config; crossed
# with normalize_and_log {false,true} -> 14 runs.
