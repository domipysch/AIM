# K is always derived from the Leiden over-clustering (dynamic K).
# Grid axes: Leiden resolution {1,3,5,7} x lambda_state_entropy {0.01,0.3,0.5,0.7}
# = 16 runs/pair.
training:
  lr:
    - 0.008
  epochs:
    - 1000
  normalize_and_log:
    - false
  reference_leiden_clustering_resolution:
    - 1.0
    - 3.0
    - 5.0
    - 7.0
loss_weights:
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.01
    lambda_spot_entropy: 0.08
    lambda_soft_contingency: 1
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.3
    lambda_spot_entropy: 0.08
    lambda_soft_contingency: 1
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.5
    lambda_spot_entropy: 0.08
    lambda_soft_contingency: 1
  - lambda_rec_spot: 0.5
    lambda_rec_gene: 0.5
    lambda_state_entropy: 0.7
    lambda_spot_entropy: 0.08
    lambda_soft_contingency: 1
