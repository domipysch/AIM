name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs history for the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: pip install black mypy types-PyYAML
      - name: Install package without deps so `aim` is importable for mypy
        run: pip install -e . --no-deps
      - name: black
        run: black --check .
      - name: mypy
        run: mypy src

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Run fast tests
        run: pytest -m "not slow"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  integration-aim:
    # End-to-end AIM sweep on the sample dataset in aim_env.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: aim_env
          environment-file: environment.yml
          auto-activate-base: false
          miniforge-version: latest
          cache-environment: true
      - name: Install package (no deps; env already has them)
        run: pip install -e . --no-deps
      - name: aim run — single pair (nearest_centroid)
        run: |
          aim run \
            --scdata     sample_dataset/scRNA/sample_sc.h5ad \
            --stdata     sample_dataset/ST/sample_st.h5ad \
            --output_dir sample_output/novel/nearest_centroid \
            --mapping    nearest_centroid --leiden_resolution 3.0
      - name: aim run — single pair (wann)
        run: |
          aim run \
            --scdata     sample_dataset/scRNA/sample_sc.h5ad \
            --stdata     sample_dataset/ST/sample_st.h5ad \
            --output_dir sample_output/novel/wann \
            --mapping    wann --leiden_resolution 3.0
      - name: aim run — batch (all pairs)
        run: |
          aim run \
            --pairs_csv  sample_dataset/pairs.csv \
            --sc_dir     sample_dataset/scRNA \
            --st_dir     sample_dataset/ST \
            --output_dir sample_output/novel/sample_batch \
            --mapping    nearest_centroid --leiden_resolution 3.0
      - name: Slow / integration tests (sample data)
        run: pytest -m slow

  integration-reference:
    # Reference-aligner path: aim_env orchestrates `aim run-reference` (single +
    # batch); tangram_env runs the aligner via `conda run`.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: aim_env
          environment-file: environment.yml
          auto-activate-base: false
          miniforge-version: latest
          cache-environment: true
      - name: Create tangram_env
        run: conda env create -f src/aim/reference_aligners/environment_tangram.yml
      - name: Install package into both envs (no deps)
        run: |
          pip install -e . --no-deps
          conda run -n tangram_env pip install -e . --no-deps
      - name: aim run-reference — single pair (tangram)
        run: |
          aim run-reference --aligner tangram \
            --scdata        sample_dataset/scRNA/sample_sc.h5ad \
            --stdata        sample_dataset/ST/sample_st.h5ad \
            --output_dir    sample_output/tangram/sample \
            --cell_type_key cellType
      - name: aim run-reference — batch (tangram)
        run: |
          aim run-reference --aligner tangram \
            --pairs_csv  sample_dataset/pairs.csv \
            --sc_dir     sample_dataset/scRNA \
            --st_dir     sample_dataset/ST \
            --output_dir sample_output/tangram/sample_batch
