name: spann_env
channels:
  - conda-forge
  - bioconda

# SPANN (https://github.com/ddb-qiwang/SPANN-torch) pins old dependencies
# (torch ~1.10, scanpy ~1.9, scikit-learn 0.24, numpy ~1.21, POT ~0.8.2, easydl),
# so this env pins python 3.9 and lets `pip install spann` pull the exact versions.
# The pins are brittle on newer CUDA/toolchains -- validate this env on the Ubuntu
# compute server (GPU) rather than assuming it resolves on Windows.

dependencies:
  - python=3.9
  - pip
  - pip:
      - spann
