name: spann_env
channels:
  - conda-forge
  - bioconda

# SPANN (https://github.com/ddb-qiwang/SPANN-torch) pins old dependencies
# (torch ~1.10, scanpy ~1.9, scikit-learn 0.24, numpy ~1.21, POT ~0.8.2, easydl),
# so this env pins python 3.9 and lets `pip install spann` pull the exact versions.
# The pins are brittle on newer CUDA/toolchains -- validate this env on the Ubuntu
# compute server (GPU) rather than assuming it resolves on Windows.

dependencies:
  - python=3.9
  - pip
  - pip:
      - spann
      # SPANN pins numpy ~1.21, but its transitive scanpy pulls a numba that
      # demands numpy >= 1.22 -> "Numba needs NumPy 1.22 or greater. Got 1.21"
      # at import. Pin numba/llvmlite to the last pair compatible with numpy 1.21
      # (numba 0.56 supports numpy 1.18-1.23) so the env imports cleanly.
      - numba==0.56.4
      - llvmlite==0.39.1
